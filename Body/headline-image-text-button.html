<table class="Stylig aus css" cellpadding="0" cellspacing="0" align="center" style="word-break: break-word; width: 600px;">
    <tbody>
<!-- Headline Start -->
    <e-optional name="01 Headline">        
        <tr>
            <td>
                <h1 e-editable="Headline">Headline</h1>
            </td>
        </tr>
    </e-optional>    
<!-- Headline Ende -->
<!-- Image Start -->
    <e-optional name="02 Image">        
        <tr>
            <td>
                <a href="https://www.platzhalter.de" e-editable="imagelink"><img src="https://placehold.co/600x400" alt="" e-editbale="imagesource"></a>
            </td>
        </tr>
    </e-optional>    
<!-- Image Ende -->
<!-- Copy Start -->
    <e-optional name="03 Copy">        
        <tr>
            <td style="width: 100%; text-align: center;">
                <p e-editable="text" class="Stylig aus css">Modultext</p>
            </td>
        </tr>
    </e-optional>    
<!-- Copy Ende -->
<!-- Button Start -->
    <e-optional name="04 Button">        
        <tr>
            <td style="text-align: center;">
                <a href="https://www.platzhalter.de" target="_blank" class="Stylig aus css" e-editable="buttonlink"><span e-editable="buttontext">Button</span></a>
            </td>
        </tr>
    </e-optional>    
<!-- Button Ende -->        
    </tbody>
</table>
